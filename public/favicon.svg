<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Outer Target Orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Middle Crosshair Ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#glow)" stroke-width="12" filter="url(#shadow)"/>
  
  <!-- Center Energy Core -->
  <circle cx="256" cy="256" r="44" fill="url(#glow)"/>
  
  <!-- Radar Sweep Beams -->
  <path d="M 256 96 L 256 156 M 256 356 L 256 416 M 96 256 L 156 256 M 356 256 L 416 256" stroke="url(#glow)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Lightning Accent inside core -->
  <path d="M 250 236 L 268 250 L 254 254 L 264 276 L 246 260 L 258 256 Z" fill="#ffffff"/>
</svg>
